name: Feature
description: Propose an implementation-ready feature.
title: "[Feature]: "
labels:
  - type:feature
  - state:proposed
body:
  - type: markdown
    attributes:
      value: "Complete every field. An Issue that is not Definition of Ready remains blocked:user."
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence describing the outcome.
      placeholder: Enable the user to ...
    validations:
      required: true
  - type: textarea
    id: in-scope
    attributes:
      label: In scope
      description: List the changes included in this Issue.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: List intentionally excluded work.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: "Use stable, unique IDs such as `AC-1: User can save a setting`."
    validations:
      required: true
  - type: textarea
    id: spec-anchors
    attributes:
      label: Spec anchors
      description: Add local Markdown links with exact section anchors, for example `specs/acceptance.md#2-issue-definition-of-ready`.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List prerequisite Issues and blockers, or write `None`.
    validations:
      required: true
  - type: textarea
    id: ui-verification
    attributes:
      label: UI verification
      description: "For UI work, describe the selected scope. Japanese iPhone features may defer English/iPad polish to one linked finishing Issue. Non-UI work may say Not applicable."
      placeholder: |
        - Target screens/states: Settings screen, loaded state
        - English expectations: Deferred/unverified; link the shared English/iPad finishing Issue here.
        - Japanese expectations: Title and controls are complete in Japanese.
    validations:
      required: true
  - type: textarea
    id: delivery-profile
    attributes:
      label: Delivery profile
      description: "Choose fast for low-risk non-UI work, standard for ordinary UI work, or strict for security, data migration, production, billing, legal, or release work. Existing Issues without this block remain strict."
      value: |
        - Profile: standard
        - Reason: Ordinary UI feature verified at a stable candidate Head.
    validations:
      required: true
  - type: textarea
    id: verification-scope
    attributes:
      label: Verification scope
      description: "Normal UI work uses iphone-ja / feature. Choose full for adaptation, release, foundation or cross-device changes. Remove this section for documentation-only or fast work. Link deferred work in Out of scope."
      value: |
        - Scope: iphone-ja
        - Stage: feature
        - Reason: Japanese iPhone first; English/iPad finishing is tracked in the shared finishing Issue.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: "For application verification, provide this complete JSON object with real app/test identifiers and explicit checks for every AC in order. Omit for documentation-only or fast Issues. The placeholder is an example, not proof of your ACs. See docs/workflow.md."
      placeholder: |
        {
          "bundleIdentifier": "com.example.ExampleApp",
          "unitTestIdentifier": "ExampleAppTests/ExampleAppTests/testSave",
          "cases": [
            {"id": "iphone-ja", "testIdentifier": "ExampleAppUITests/SmokeTests/testLaunch"}
          ],
          "acceptanceMappings": [
            {"id": "AC-1", "checks": ["stage:build", "stage:unit-tests"]},
            {"id": "AC-2", "checks": ["case:iphone-ja", "visual:iphone-ja"]}
          ]
        }
    validations:
      required: false
  - type: textarea
    id: external-operations
    attributes:
      label: External operations
      description: "Write `None`, or one or more exact five-field blocks in this order. Operation must be an exact ID from `docs/AUTHORITY.md`; Executor must be Codex or Claude; repeat the block for each operation."
      placeholder: |
        - Operation: github.read_issue
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.update_issue
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.push_branch
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.create_pr
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.merge_pr
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.delete_branch
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no
    validations:
      required: true
  - type: textarea
    id: user-approvals
    attributes:
      label: User approvals
      description: "When Approval required is yes, cite an approval Issue, decision, or URL; otherwise write `None` or `No additional approval`."
    validations:
      required: true
