name: Feature
description: Propose an implementation-ready feature.
title: "[Feature]: "
labels:
  - type:feature
  - state:proposed
body:
  - type: markdown
    attributes:
      value: "Complete every field. An Issue that is not Definition of Ready remains blocked:user. A current user request for an HTML comparison takes priority regardless of an existing direction; a current explicit skip overrides only with clear currentness, exact scope, authority, reason, and no conflicting comparison request. Otherwise use confirmed-direction reuse when a confirmed specification covers the exact hierarchy/flow; gate an unconfirmed direction when work creates the first user-facing UI, creates or changes root navigation/information architecture, or materially redesigns a primary flow; permit bounded direction-neutral UI only when none of those triggers applies and acceptance decides no hierarchy, navigation, or primary-flow interaction. Ambiguity gates. Identity/bootstrap and pure non-UI work use not-applicable."
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence describing the outcome.
      placeholder: Enable the user to ...
    validations:
      required: true
  - type: textarea
    id: in-scope
    attributes:
      label: In scope
      description: List the changes included in this Issue.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: List intentionally excluded work.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: "Use stable, unique IDs. Every contract claimed at or after the `2026-09-06T00:31:41Z` cutover must have exactly one valid declaration across existing ACs: start one AC text immediately after its ID with `AC-1: UI-direction route: <route>; Scope: <nonempty>; Reason: <nonempty>`. `<route>` must be exactly `comparison`, `explicit-skip`, `confirmed-direction reuse`, `bounded direction-neutral`, or `not-applicable`; add selection/reuse/neutral/current-skip/non-UI facts after Reason. Incidental route words elsewhere do not count."
    validations:
      required: true
  - type: textarea
    id: spec-anchors
    attributes:
      label: Spec anchors
      description: Add local Markdown links with exact section anchors, for example `specs/acceptance.md#2-issue-definition-of-ready`. Apply `.agents/skills/ui-direction/SKILL.md` when its trigger matches. `comparison` links the merged selection specification and Decision containing the exact presented-bytes SHA-256 and element decisions; `confirmed-direction reuse` links the exact reusable UI-direction anchor; `bounded direction-neutral` links the relevant confirmed product/behavior requirement; `explicit-skip` links its confirmed product/specification or Decision basis; `not-applicable` links the relevant product/specification requirement without requiring a UI-direction anchor. Comparison HTML and live UI verification alone are not spec anchors.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List prerequisite Issues and blockers, or write `None`. A gated native UI Issue depends on the merged direction-selection specification Issue.
    validations:
      required: true
  - type: textarea
    id: ui-verification
    attributes:
      label: UI verification
      description: "For every UI Issue, keep exactly three ordered lines: `Target screens/states`, `English expectations`, and `Japanese expectations`. This is live guidance and is not part of the sealed Issue contract or review packet; put the authoritative `UI-direction route: <route>; Scope: <nonempty>; Reason: <nonempty>` declaration at the start of one existing AC, route-specific facts after Reason, anchors in Spec anchors, and prerequisite Issues in Dependencies. For Identity/bootstrap or pure non-UI work, enter exactly `Not applicable` and nothing else here; put scope/non-UI reason in Goal/In scope, start one AC with `UI-direction route: not-applicable; Scope: <nonempty>; Reason: <nonempty>`, and put the relevant product/specification anchor in Spec anchors. Defer only needed English/iPad or other quality work to focused harden Issues."
      placeholder: |
        - Target screens/states: Settings screen, loaded state
        - English expectations: Deferred/unverified; link a focused harden Issue if this release needs it.
        - Japanese expectations: Title and controls are complete in Japanese.
    validations:
      required: true
  - type: textarea
    id: delivery-stage
    attributes:
      label: Delivery stage
      description: "Use shape for application feature work or harden for bounded quality/workflow work. release is reserved for the Release form. Change the 120-minute budget when the Issue justifies it."
      value: |
        - Stage: shape
        - Time budget: 120 minutes
        - Reason: Produce an operable Japanese-iPhone primary flow before broad quality work.
    validations:
      required: true
  - type: textarea
    id: delivery-profile
    attributes:
      label: Delivery profile
      description: "Choose fast for low-risk non-UI work, standard for ordinary UI work, or strict for security, data migration, production, billing, legal, or release work. Existing Issues without this block remain strict."
      value: |
        - Profile: standard
        - Reason: Ordinary UI feature verified at a stable candidate Head.
    validations:
      required: true
  - type: textarea
    id: verification-scope
    attributes:
      label: Verification scope
      description: "shape uses iphone-ja. Application harden uses targeted with ordered affected cases. Omit this field and Verification for workflow-only harden work."
      value: |
        - Scope: iphone-ja
        - Reason: One representative Japanese iPhone is enough to inspect the initial shape.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: "For application verification, provide this complete JSON object with real app/test identifiers and explicit checks for every AC in order. Omit for documentation-only, fast, or workflow-only Issues. The placeholder is an example, not proof of your ACs. See docs/workflow.md."
      placeholder: |
        {
          "bundleIdentifier": "com.example.ExampleApp",
          "unitTestIdentifier": "ExampleAppTests/ExampleAppTests/testSave",
          "cases": [
            {"id": "iphone-ja", "testIdentifier": "ExampleAppUITests/SmokeTests/testLaunch"}
          ],
          "acceptanceMappings": [
            {"id": "AC-1", "checks": ["stage:build", "stage:unit-tests"]},
            {"id": "AC-2", "checks": ["case:iphone-ja"]}
          ]
        }
    validations:
      required: false
  - type: textarea
    id: external-operations
    attributes:
      label: External operations
      description: "Write `None`, or one or more exact five-field blocks in this order. Operation must be an exact ID from `docs/AUTHORITY.md`; Executor must be Codex or Claude; repeat the block for each operation."
      placeholder: |
        - Operation: github.read_issue
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.update_issue
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.push_branch
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.create_pr
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.merge_pr
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.delete_branch
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no
    validations:
      required: true
  - type: textarea
    id: user-approvals
    attributes:
      label: User approvals
      description: "When Approval required is yes, cite an approval Issue, decision, or URL; otherwise write `None` or `No additional approval`."
    validations:
      required: true
