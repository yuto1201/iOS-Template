name: Regression
description: Report a defect found after merge or physical-device confirmation.
title: "[Regression]: "
labels:
  - type:regression
  - state:proposed
body:
  - type: markdown
    attributes:
      value: "Use this form only for a post-merge or physical-device regression; pre-merge defects remain in the original Issue. If the regression belongs to a release unit, bind its exact committed phase record and classify whether it stays in the current Phase or reopens an earlier Phase."
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence describing the corrected behavior.
    validations:
      required: true
  - type: textarea
    id: in-scope
    attributes:
      label: In scope
      description: List the regression correction included here.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: List intentionally excluded work.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: "Use stable, unique IDs. For a phase-aware regression, start one AC with exact `Release-phase binding: {\"phase\":5,\"reason\":\"...\",\"recordDigest\":\"sha256:...\",\"recordPath\":\"Config/releases/<release>/phase-records/<record>.json\",\"releaseIdentifier\":\"<release>\",\"revision\":1,\"route\":\"standard\",\"scope\":[\"<scope>\"],\"workKind\":\"implementation\"}` in canonical key order; preserve an existing unbound sealed contract as `legacy-unbound`. A strict shape/iphone-ja or application harden/targeted regression that intentionally verifies a provider in a committed isolated fixture may start at most one AC with exact `Application-fixture binding: {\"fixtureRoot\":\"tools/tests/fixtures/<provider>\",\"project\":\"tools/tests/fixtures/<provider>/<Fixture>.xcodeproj\",\"route\":\"tracked-fixture-v1\",\"schemaVersion\":1,\"skillRoot\":\".agents/skills/<provider>\",\"toolPaths\":[\"tools/<provider-tool>\"]}`. Keep canonical key order, sorted unique tool paths, the same provider namespace, and complete application Verification; do not use it for workflow-only or release work. Head must contain `.agents/skills/<provider>/application-fixture.json` with the exact canonical binding bytes: add it only with a new provider surface, or retain the exact Base marker for an already owned provider. Repository-test manifest changes may only add provider-specific entries without changing existing ones. For workflow-only harden + strict work claimed at or after `2026-09-13T13:03:38Z`, start exactly one AC with `Repository-test scope: targeted|head-all|base-and-head; Reason: <nonempty>`; choose targeted for one known domain, head-all for broad/test-infrastructure changes, and base-and-head only for explicit revision comparison."
    validations:
      required: true
  - type: textarea
    id: spec-anchors
    attributes:
      label: Spec anchors
      description: Add local Markdown links with exact section anchors.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List prerequisite Issues and blockers, or write `None`. An Issue using `Application-fixture binding:` must list both #121 and #122 directly and must not be approved or claimed until both are `state:done`.
    validations:
      required: true
  - type: textarea
    id: ui-verification
    attributes:
      label: UI verification
      description: "Describe only this regression's affected target and cases. Unrelated quality work belongs to separate harden Issues. Non-UI work may say Not applicable."
      placeholder: |
        - Target screens/states: Settings screen, reproduced and corrected states
        - English expectations: Include only when affected; otherwise explicitly out of scope.
        - Japanese expectations: The corrected state is complete in Japanese.
    validations:
      required: true
  - type: textarea
    id: delivery-stage
    attributes:
      label: Delivery stage
      description: "Use harden for bounded regressions and keep the problem narrow. release is reserved for the Release form."
      value: |
        - Stage: harden
        - Time budget: 180 minutes
        - Reason: Correct one approved behavior and verify only the affected target.
    validations:
      required: true
  - type: textarea
    id: delivery-profile
    attributes:
      label: Delivery profile
      description: "Choose fast for low-risk non-UI work, standard for ordinary UI work, or strict for security, data migration, production, billing, legal, or release work. Existing Issues without this block remain strict."
      value: |
        - Profile: standard
        - Reason: User-visible regression requiring final UI verification.
    validations:
      required: true
  - type: textarea
    id: verification-scope
    attributes:
      label: Verification scope
      description: "Use targeted and list exact affected Simulator cases for application regressions. Omit this field and Verification for workflow-only harden work."
      value: |
        - Scope: targeted
        - Reason: Verify only the device/language cases affected by this regression.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: "For application verification, provide this complete JSON object with real app/test identifiers and explicit checks for every AC in order. When `Application-fixture binding:` is present, the runner project must exactly equal its committed nested `project` and mappings must not contain `visual:` checks, preserving the `xcodebuild-stage` route; the binding does not create a workflow-only route or weaken Build/Test evidence. Omit for documentation-only, fast, or workflow-only Issues. The placeholder is an example, not proof of your ACs. See docs/workflow.md."
      placeholder: |
        {
          "bundleIdentifier": "com.example.ExampleApp",
          "unitTestIdentifier": "ExampleAppTests/ExampleAppTests/testSave",
          "cases": [
            {"id": "iphone-ja", "testIdentifier": "ExampleAppUITests/SmokeTests/testLaunch"}
          ],
          "acceptanceMappings": [
            {"id": "AC-1", "checks": ["stage:build", "stage:unit-tests"]},
            {"id": "AC-2", "checks": ["case:iphone-ja"]}
          ]
        }
    validations:
      required: false
  - type: textarea
    id: external-operations
    attributes:
      label: External operations
      description: "Write `None`, or one or more exact five-field blocks in this order. Operation must be an exact ID from `docs/AUTHORITY.md`; Executor must be Codex or Claude; repeat the block for each operation."
      placeholder: |
        - Operation: github.read_issue
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.update_issue
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.push_branch
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.create_pr
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.merge_pr
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no

        - Operation: github.delete_branch
        - Service: GitHub
        - Environment: production
        - Executor: Codex
        - Approval required: no
    validations:
      required: true
  - type: textarea
    id: user-approvals
    attributes:
      label: User approvals
      description: "When Approval required is yes, cite an approval Issue, decision, or URL; otherwise write `None` or `No additional approval`."
    validations:
      required: true
  - type: input
    id: original-pr
    attributes:
      label: Original PR
      description: Enter the merged PR number, for example `#42`.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: Provide deterministic numbered steps and the observed result.
    validations:
      required: true
